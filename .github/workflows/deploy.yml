name: Deploy

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy secrets live in this environment, which only master may use, so
    # workflows pushed on other branches (e.g. agent/**) can't read them.
    environment: production
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          script: |
            cd /home/ahmedia/public_html
            .scripts/deploy.sh
