<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doppler Rings Tuner</title>
<style>
  :root {
    --color-page-top: #005e5e;
    --color-page-bottom: #004a4a;
    --color-accent: #00ffff;
    --glow-color: #00ffff;
    --color-muted: rgba(255, 255, 255, 0.7);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    color: #fff;
    background: linear-gradient(180deg, var(--color-page-top), var(--color-page-bottom));
    min-height: 100vh;
  }

  /* ---- The component ---------------------------------------------------- */

  /*
   * Doppler rings: each circle is born at the source, then grows and drifts
   * along the axis at a fixed ratio (--mach), so its centre offset is
   * proportional to its radius: the wavefronts of a moving source.
   *   --mach < 1 : rings nest, crowding on one side
   *   --mach > 1 : rings cross each other
   * Per-ring --phase and --size add fixed irregularity, so the set reads as
   * hand-placed rather than as an even diagram. Every centre stays on the
   * horizon (--source-y): that shared axis is what anchors the motif.
   */
  .doppler {
    --rings: 4;
    --period: 25s;
    --mach: 1.8;
    --reach: 200;      /* final radius, in viewBox units */
    --source-x: 120px; /* source point, in viewBox units */
    --source-y: 300px;
    --direction: 1;    /* 1 = travel right, -1 = travel left */
    --stroke: 1.25;
    --glow: 3;
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
    /* On the layer, not each ring: a filter inside a scaled ring scales with it */
    filter:
      drop-shadow(0 0 calc(var(--glow) * 0.4px) var(--glow-color))
      drop-shadow(0 0 calc(var(--glow) * 1px) color-mix(in srgb, var(--glow-color) 60%, transparent));
  }
  .doppler circle {
    fill: none;
    stroke: var(--color-accent);
    stroke-width: var(--stroke);
    vector-effect: non-scaling-stroke;
    transform-box: view-box;
    transform-origin: 0 0;
    opacity: 0;
    /* --tempo gives each ring its own cycle length, so the set never lines up the same way twice */
    animation: doppler-propagate calc(var(--period) * var(--tempo, 1)) linear infinite;
    animation-delay: calc(var(--period) * (var(--i) + var(--phase, 0)) / var(--rings) * -1);
  }
  .doppler .source {
    fill: var(--color-accent);
    stroke: none;
    animation: none;
    opacity: 1;
    transform: translate(var(--source-x), var(--source-y)) scale(5);
  }
  @keyframes doppler-propagate {
    from {
      transform: translate(var(--source-x), var(--source-y)) scale(0.001);
      opacity: 0;
    }
    6% { opacity: 0.9; }
    to {
      transform:
        translate(
          calc(var(--source-x) + var(--reach) * var(--mach) * var(--direction) * 1px),
          var(--source-y)
        )
        scale(calc(var(--reach) * (1 + var(--size, 0))));
      opacity: 0;
    }
  }
  /* Static version: pausing at the staggered delays freezes a Doppler diagram */
  .doppler.is-static circle { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) {
    .doppler circle { animation-play-state: paused; }
  }

  /* ---- Prototype page -------------------------------------------------- */

  .header {
    display: flex; align-items: center; gap: .6rem;
    padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,.15);
  }
  .brand-mark { width: 2.4rem; height: 1.6rem; }
  .brand {
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 1.05rem;
    text-shadow: 0 0 4px color-mix(in srgb, var(--glow-color) 55%, transparent),
      0 0 10px color-mix(in srgb, var(--glow-color) 25%, transparent);
  }
  .hero {
    position: relative;
    min-height: 34rem;
    display: grid;
    align-items: center;
    overflow: hidden;
    border-bottom: 1px solid rgba(255,255,255,.15);
  }
  .hero .doppler-stage { position: absolute; inset: 0; }
  .hero-copy {
    position: relative;
    justify-self: end;
    max-width: 34rem;
    padding: 3rem 1.5rem;
    text-align: right;
  }
  .display-title {
    margin: 0; font-size: clamp(3rem, 8vw, 6.5rem); line-height: .95; letter-spacing: -.04em;
    text-shadow: 0 0 4px color-mix(in srgb, var(--glow-color) 55%, transparent),
      0 0 10px color-mix(in srgb, var(--glow-color) 25%, transparent);
  }
  .text-accent { color: var(--color-accent); }
  .lede { color: var(--color-muted); line-height: 1.7; }
  .controls {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
    gap: 1rem 2rem; padding: 1.5rem; max-width: 72rem; margin: 0 auto;
  }
  .controls h2 {
    grid-column: 1 / -1; margin: .5rem 0 0; font-size: .8rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--color-accent);
  }
  .controls label { display: grid; gap: .35rem; font-size: .9rem; color: var(--color-muted); }
  .controls output { color: #fff; font-weight: 700; }
  .controls input[type=range] { width: 100%; accent-color: var(--color-accent); }
  .presets { padding: 0 1.5rem 1.5rem; max-width: 72rem; margin: 0 auto; display: flex; flex-wrap: wrap; gap: .5rem; }
  .presets button {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3);
    padding: .5rem .9rem; font: inherit; font-size: .9rem; cursor: pointer;
  }
  .presets button:hover { border-color: var(--color-accent); color: var(--color-accent); }
  .presets .primary { border-color: var(--color-accent); color: var(--color-accent); }
  .settings {
    max-width: 72rem; margin: 0 auto; padding: 0 1.5rem 2rem;
    font-family: ui-monospace, Menlo, monospace; font-size: .8rem; color: var(--color-muted);
    overflow-wrap: anywhere;
  }
  @media (max-width: 40rem) {
    .hero-copy { justify-self: stretch; text-align: left; }
  }
</style>
</head>
<body>
  <!--
    Tuning tool for the hero's Doppler rings (resources/views/components/doppler-rings.blade.php).
    Open this file directly in a browser. Defaults are the live settings; "Copy settings" gives
    the per-ring values to paste into the component. Not served by the app.
  -->
  <header class="header">
    <!-- Header mark: the same component, frozen -->
    <svg class="brand-mark doppler is-static" viewBox="0 0 90 60" aria-hidden="true"
         style="--rings:4; --reach:26; --source-x:12px; --source-y:30px; --mach:.8; --period:4s">
      <circle r="1" style="--i:0"/><circle r="1" style="--i:1"/>
      <circle r="1" style="--i:2"/><circle r="1" style="--i:3"/>
    </svg>
    <span class="brand">AH Media</span>
  </header>

  <section class="hero">
    <div class="doppler-stage">
      <svg class="doppler" id="hero-rings" viewBox="0 0 1000 600"
           preserveAspectRatio="xMinYMid slice" aria-hidden="true"></svg>
    </div>
    <div class="hero-copy">
      <h1 class="display-title">AH Media<span class="text-accent">.ai</span></h1>
      <p class="lede">Placeholder copy. The rings sit behind the hero as their own layer, so content
        can change freely without touching them.</p>
    </div>
  </section>

  <div class="controls">
    <h2>Geometry</h2>
    <label>Mach (offset ratio) <output id="o-mach"></output>
      <input type="range" id="mach" min="0" max="3" step="0.05" value="2.8"></label>
    <label>Rings <output id="o-rings"></output>
      <input type="range" id="rings" min="2" max="14" step="1" value="8"></label>
    <label>Cycle (seconds) <output id="o-period"></output>
      <input type="range" id="period" min="3" max="40" step="1" value="39"></label>
    <label>Reach (final radius) <output id="o-reach"></output>
      <input type="range" id="reach" min="100" max="900" step="10" value="300"></label>

    <h2>Randomness</h2>
    <label>Spacing jitter <output id="o-spacing"></output>
      <input type="range" id="spacing" min="0" max="1" step="0.05" value="1"></label>
    <label>Size jitter <output id="o-size"></output>
      <input type="range" id="size" min="0" max="1" step="0.05" value="0.55"></label>
    <label>Seed <output id="o-seed"></output>
      <input type="range" id="seed" min="1" max="999" step="1" value="7"></label>
    <label>Tempo jitter (no repeats) <output id="o-tempo"></output>
      <input type="range" id="tempo" min="0" max="0.3" step="0.01" value="0"></label>

    <h2>Style</h2>
    <label>Stroke width <output id="o-stroke"></output>
      <input type="range" id="stroke" min="0.5" max="4" step="0.25" value="2"></label>
    <label>Glow <output id="o-glow"></output>
      <input type="range" id="glow" min="0" max="16" step="1" value="12"></label>
    <label><span><input type="checkbox" id="static"> Freeze (static diagram)</span></label>
    <label><span><input type="checkbox" id="reverse" checked> Travel left</span></label>
    <label><span><input type="checkbox" id="source"> Show source dot</span></label>
  </div>
  <div class="presets">
    <button class="primary" id="reshuffle">Reshuffle randomness</button>
    <button class="primary" id="copy">Copy settings</button>
    <button data-preset='{"mach":0,"rings":6,"period":10,"reach":520,"spacing":0,"size":0}'>Concentric (for contrast)</button>
    <button data-preset='{"mach":0.6,"rings":7,"period":12,"reach":520,"spacing":0,"size":0}'>Doppler, even</button>
    <button data-preset='{"mach":1.8,"rings":4,"period":25,"reach":200,"spacing":0,"size":0}'>Your pick, even</button>
    <button data-preset='{"mach":1.8,"rings":4,"period":25,"reach":200,"spacing":0.5,"size":0.35}'>Your pick, irregular</button>
    <button data-preset='{"stroke":2,"glow":12}'>Old-site neon</button>
    <button data-preset='{"mach":2.8,"rings":8,"period":39,"reach":300,"spacing":1,"size":0.55,"seed":7,"tempo":0,"stroke":2,"glow":12,"static":false,"reverse":true,"source":false}'>Your pick (loops every 39s)</button>
    <button data-preset='{"mach":2.8,"rings":8,"period":39,"reach":300,"spacing":1,"size":0.55,"seed":7,"tempo":0.12,"stroke":2,"glow":12,"static":false,"reverse":true,"source":false}'>Your pick, never repeats</button>
  </div>
  <p class="settings" id="settings"></p>

<script>
  const svg = document.getElementById('hero-rings');
  const ranges = ['mach', 'rings', 'period', 'reach', 'spacing', 'size', 'seed', 'tempo', 'stroke', 'glow']
    .map((id) => document.getElementById(id));
  const value = (id) => Number(document.getElementById(id).value);
  const checked = (id) => document.getElementById(id).checked;
  const ns = 'http://www.w3.org/2000/svg';

  // Seeded random (mulberry32), so a seed always gives the same arrangement
  function seededRandom(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function render() {
    const rings = value('rings');
    const style = svg.style;
    style.setProperty('--mach', value('mach'));
    style.setProperty('--rings', rings);
    style.setProperty('--period', value('period') + 's');
    style.setProperty('--reach', value('reach'));
    style.setProperty('--stroke', value('stroke'));
    style.setProperty('--glow', value('glow'));
    style.setProperty('--direction', checked('reverse') ? -1 : 1);
    style.setProperty('--source-x', checked('reverse') ? '880px' : '120px');
    svg.classList.toggle('is-static', checked('static'));
    ranges.forEach((input) => { document.getElementById('o-' + input.id).textContent = input.value; });

    if (svg.querySelectorAll('circle:not(.source)').length !== rings) {
      svg.replaceChildren();
      for (let i = 0; i < rings; i++) {
        const circle = document.createElementNS(ns, 'circle');
        circle.setAttribute('r', 1);
        circle.style.setProperty('--i', i);
        svg.append(circle);
      }
      const source = document.createElementNS(ns, 'circle');
      source.setAttribute('r', 1);
      source.classList.add('source');
      svg.append(source);
    }
    svg.querySelector('.source').style.display = checked('source') ? '' : 'none';

    // Fixed per-ring irregularity: on the site these become literal values in the markup
    const random = seededRandom(value('seed'));
    // Separate stream for tempo, so adding it doesn't change existing seeds' sizes and spacing
    const tempoRandom = seededRandom(value('seed') * 7919 + 1);
    const perRing = [];
    svg.querySelectorAll('circle:not(.source)').forEach((circle) => {
      const phase = ((random() - 0.5) * value('spacing')).toFixed(3);
      const size = ((random() - 0.5) * 2 * value('size')).toFixed(3);
      random(); // was off-axis drift; still drawn so existing seeds keep their arrangement
      circle.style.setProperty('--phase', phase);
      const tempo = (1 + (tempoRandom() - 0.5) * 2 * value('tempo')).toFixed(3);
      circle.style.setProperty('--size', size);
      circle.style.setProperty('--tempo', tempo);
      perRing.push({ phase: Number(phase), size: Number(size), tempo: Number(tempo) });
    });

    const settings = {
      mach: value('mach'), rings, period: value('period'), reach: value('reach'),
      spacing: value('spacing'), size: value('size'), seed: value('seed'), tempo: value('tempo'),
      stroke: value('stroke'), glow: value('glow'),
      frozen: checked('static'), travelLeft: checked('reverse'), sourceDot: checked('source'),
      perRing,
    };
    document.getElementById('settings').textContent = JSON.stringify(settings);
  }

  document.querySelectorAll('input').forEach((input) => input.addEventListener('input', render));
  document.querySelectorAll('[data-preset]').forEach((button) => button.addEventListener('click', () => {
    const preset = JSON.parse(button.dataset.preset);
    ranges.forEach((input) => { if (input.id in preset) { input.value = preset[input.id]; } });
    ['static', 'reverse', 'source'].forEach((id) => { if (id in preset) { document.getElementById(id).checked = preset[id]; } });
    render();
  }));
  document.getElementById('reshuffle').addEventListener('click', () => {
    document.getElementById('seed').value = 1 + Math.floor(Math.random() * 999);
    render();
  });
  document.getElementById('copy').addEventListener('click', async (event) => {
    try {
      await navigator.clipboard.writeText(document.getElementById('settings').textContent);
      event.target.textContent = 'Copied';
    } catch {
      event.target.textContent = 'Copy failed: select the line below';
    }
    setTimeout(() => { event.target.textContent = 'Copy settings'; }, 1500);
  });
  render();
</script>
</body>
</html>
